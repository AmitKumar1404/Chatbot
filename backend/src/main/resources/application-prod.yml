spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: chatbot_user
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT_MS:1000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000ms}

server:
  port: 9999

app:
  redis:
    stream:
      active-ttl-seconds: ${REDIS_STREAM_ACTIVE_TTL_SECONDS:1800}
      disconnected-ttl-seconds: ${REDIS_STREAM_DISCONNECTED_TTL_SECONDS:3600}
  ai:
    ollama:
      base-url: http://localhost:11434
      model: phi3
      system-prompt: "You are a helpful AI assistant. Answer clearly and concisely."
