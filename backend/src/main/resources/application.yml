server:
  port: 9998
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT_MS:1000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000ms}

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
    refresh-expiration: 2592000000

  password-reset:
    expiration: 3600000

  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

  mail:
    from: ${MAIL_FROM:noreply@chatbot.local}

  openapi:
    title: Chatbot Backend API
    description: REST APIs for authentication, chat sessions, messaging, and search.
    version: v1

  ai:
    ollama:
      base-url: http://localhost:11434
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      system-prompt: "You are a helpful AI assistant. Answer clearly and concisely."

  rag:
    hybrid:
      enabled: true
      dense-weight: 0.7

    retrieval:
      vector-weight: 0.8
      keyword-weight: 0.2
      top-k: 5

    context:
      max-chunks: 5
      max-characters: 6000

    chunking:
      enabled: true
      chunk-size: 800
      overlap: 100

    embedding:
      include-heading: true
      include-page-number: false
      include-metadata: false
      batch-size: 32
      log-previews: true

  redis:
    stream:
      active-ttl-seconds: ${REDIS_STREAM_ACTIVE_TTL_SECONDS:1800}
      disconnected-ttl-seconds: ${REDIS_STREAM_DISCONNECTED_TTL_SECONDS:3600}

  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60

    chat:
      capacity: 60
      refill-tokens: 60
      refill-duration-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  packages-to-scan: com.chatbot.controller

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: Chatbot Backend
    version: 1.0.0
    description: ChatGPT-like AI chatbot backend

file:
  upload-dir: uploads