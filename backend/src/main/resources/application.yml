spring:
  profiles:
    active: prod
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT_MS:1000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000ms}

server:
  port: 9998
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: your-256-bit-secret-key-change-this-in-production-must-be-long
    expiration: 86400000
  openapi:
    title: Chatbot Backend API
    description: REST APIs for authentication, chat sessions, messaging, and search.
    version: v1
  ai:
    ollama:
      base-url: http://localhost:11434
      model: phi3
      system-prompt: "You are a helpful AI assistant. Answer clearly and concisely."

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.chatbot.controller
